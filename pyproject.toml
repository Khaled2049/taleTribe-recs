[project]
name = "taleTribe-recs"
version = "0.1.0"
description = "TaleTribe recommendation service — pgvector retrieval, HyDE, MMR diversification, and LLM explanations"
license = {text = "MIT"}
authors = [
    {name = "Khaled Hossain", email = "khaledhossain.not@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "structlog>=24.0.0",
    "google-auth>=2.23.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "anyio>=4.0.0",
    "numpy>=1.24.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ruff = "*"
black = "*"
isort = "*"

[tool.poetry.group.local-embeddings]
optional = true

[tool.poetry.group.local-embeddings.dependencies]
sentence-transformers = ">=2.2.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
