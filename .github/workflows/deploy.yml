name: Deploy recommendations

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: deploy-recs
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: story-6f89f
  REGION: us-central1
  REPOSITORY: novelsync-recs
  STORY_DATA_REPOSITORY: Khaled2049/story-data
  SCHEDULER_PAUSED: ${{ vars.RECS_SCHEDULER_PAUSED || 'true' }}

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RECS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      USE_MOCK: "true"
      GOOGLE_CLOUD_PROJECT: test-project

    steps:
      - name: Checkout recommendations
        uses: actions/checkout@v4

      - name: Checkout story-data migrations
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STORY_DATA_REPOSITORY }}
          path: _story-data

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _story-data/go.mod
          cache-dependency-path: _story-data/go.sum

      - name: Apply story-data schema
        working-directory: _story-data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE recs_service NOLOGIN'
          go run ./cmd/api migrate

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev

      - name: Check and test
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run ruff check --select E7,E9,F .
          poetry run python -m pytest tests/ -q

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment prerequisites
        run: |
          gcloud run jobs describe novelsync-story-data-sync-recs \
            --region="$REGION" --project="$PROJECT_ID" >/dev/null
          for secret_name in recs-postgres-dsn-rw recs-postgres-dsn-ro google-ai-studio-api-key; do
            state=$(gcloud secrets versions describe latest \
              --secret="$secret_name" --project="$PROJECT_ID" \
              --format='value(state)')
            if [ "$state" != "ENABLED" ]; then
              echo "::error::Secret $secret_name has no enabled latest version"
              exit 1
            fi
          done

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 ||
          gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker --location="$REGION" \
            --project="$PROJECT_ID" \
            --description="NovelSync recommendation service images"

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: recommendation_engine/terraform
        run: |
          terraform init
          terraform plan -input=false \
            -var="image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${{ github.sha }}" \
            -var="scheduler_paused=$SCHEDULER_PAUSED" \
            -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Read deployment outputs
        id: terraform
        working-directory: recommendation_engine/terraform
        run: |
          echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"
          echo "scheduler_paused=$(terraform output -raw scheduler_paused)" >> "$GITHUB_OUTPUT"

      - name: Authenticate smoke test
        id: smoke_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.terraform.outputs.service_url }}

      - name: Verify service health body
        env:
          ID_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
          SERVICE_URL: ${{ steps.terraform.outputs.service_url }}
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -sS --max-time 15 \
              -H "Authorization: Bearer $ID_TOKEN" \
              -o /tmp/recs-health.json -w '%{http_code}' \
              "$SERVICE_URL/health" || true)
            if [ "$status" = "200" ] && jq -e '
              .status == "ok" and
              .embedding_dimension_ok == true and
              .embed_model_ok == true and
              .database.connected == true and
              .database.schema_present == true and
              .database.pgvector_ok == true and
              .database.hnsw_index_present == true
            ' /tmp/recs-health.json >/dev/null; then
              cat /tmp/recs-health.json
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $status"
            sleep 6
          done
          cat /tmp/recs-health.json 2>/dev/null || true
          exit 1

      - name: Deployment summary
        run: |
          echo "## Recommendations deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ steps.terraform.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler paused: ${{ steps.terraform.outputs.scheduler_paused }}" >> "$GITHUB_STEP_SUMMARY"
