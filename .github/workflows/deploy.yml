name: Deploy recommendations

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch: null

concurrency:
  group: taleTribe-recs-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  PROJECT_ID: story-6f89f
  REGION: us-central1
  REPOSITORY: novelsync-recs
  KEEP_IMAGE_COUNT: "3"
  SCHEDULER_PAUSED: ${{ vars.RECS_SCHEDULER_PAUSED || 'true' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    name: taleTribe-recs / deploy-deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
      - name: Verify deployment prerequisites
        run: |
          gcloud run jobs describe novelsync-story-data-sync-recs \
            --region="$REGION" --project="$PROJECT_ID" >/dev/null
          for secret_name in recs-postgres-dsn-rw recs-postgres-dsn-ro google-ai-studio-api-key; do
            state=$(gcloud secrets versions describe latest \
              --secret="$secret_name" --project="$PROJECT_ID" \
              --format='value(state)')
            if [ "$state" != "ENABLED" ]; then
              echo "::error::Secret $secret_name has no enabled latest version"
              exit 1
            fi
          done

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 ||
          gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker --location="$REGION" \
            --project="$PROJECT_ID" \
            --description="TheTaleTribe recommendation service images"

      # Each deploy pushes an immutable :sha image. Keep the newest
      # KEEP_IMAGE_COUNT for rollback and delete the rest, so storage does not
      # grow forever. Same policy as novelsync-agents; --no-dry-run makes the
      # deletions real.
      - name: Apply Artifact Registry cleanup policy
        run: |
          cat > "$RUNNER_TEMP/cleanup-policy.json" <<EOF
          [
            {
              "name": "keep-recent",
              "action": {"type": "Keep"},
              "mostRecentVersions": {"keepCount": $KEEP_IMAGE_COUNT}
            },
            {
              "name": "delete-stale",
              "action": {"type": "Delete"},
              "condition": {"tagState": "ANY"}
            }
          ]
          EOF
          gcloud artifacts repositories set-cleanup-policies "$REPOSITORY" \
            --location="$REGION" --project="$PROJECT_ID" \
            --policy="$RUNNER_TEMP/cleanup-policy.json" \
            --no-dry-run

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build and push immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: recommendation_engine/terraform
        run: |
          terraform init
          terraform plan -input=false \
            -var="image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/app:${INPUT_GITHUB_SHA}" \
            -var="scheduler_paused=$SCHEDULER_PAUSED" \
            -out=tfplan
          terraform apply -auto-approve tfplan

        env:
          INPUT_GITHUB_SHA: ${{ github.sha }}
      - name: Read deployment outputs
        id: terraform
        working-directory: recommendation_engine/terraform
        run: |
          echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"
          echo "scheduler_paused=$(terraform output -raw scheduler_paused)" >> "$GITHUB_OUTPUT"

      - name: Authenticate smoke test
        id: smoke_auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.terraform.outputs.service_url }}

      - name: Verify service health body
        env:
          ID_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
          SERVICE_URL: ${{ steps.terraform.outputs.service_url }}
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -sS --max-time 15 \
              -H "Authorization: Bearer $ID_TOKEN" \
              -o /tmp/recs-health.json -w '%{http_code}' \
              "$SERVICE_URL/health" || true)
            if [ "$status" = "200" ] && jq -e '
              .status == "ok" and
              .embedding_dimension_ok == true and
              .embed_model_ok == true and
              .database.connected == true and
              .database.schema_present == true and
              .database.pgvector_ok == true and
              .database.hnsw_index_present == true
            ' /tmp/recs-health.json >/dev/null; then
              cat /tmp/recs-health.json
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $status"
            sleep 6
          done
          cat /tmp/recs-health.json 2>/dev/null || true
          exit 1

      - name: Deployment summary
        run: |
          echo "## Recommendations deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${INPUT_STEPS_TERRAFORM_OUTPUTS_SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${INPUT_GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler paused: ${INPUT_STEPS_TERRAFORM_OUTPUTS_SCHEDULER_PAUSED}" >> "$GITHUB_STEP_SUMMARY"
        env:
          INPUT_STEPS_TERRAFORM_OUTPUTS_SERVICE_URL: ${{ steps.terraform.outputs.service_url }}
          INPUT_GITHUB_SHA: ${{ github.sha }}
          INPUT_STEPS_TERRAFORM_OUTPUTS_SCHEDULER_PAUSED: ${{ steps.terraform.outputs.scheduler_paused }}
    permissions:
      contents: read
      id-token: write
