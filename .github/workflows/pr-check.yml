name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-recs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RECS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      USE_MOCK: "true"
      GOOGLE_CLOUD_PROJECT: test-project

    steps:
      - name: Checkout recommendations
        uses: actions/checkout@v4

      - name: Checkout story-data migrations
        uses: actions/checkout@v4
        with:
          repository: Khaled2049/story-data
          path: _story-data

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _story-data/go.mod
          cache-dependency-path: _story-data/go.sum

      - name: Apply story-data schema
        working-directory: _story-data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE recs_service NOLOGIN'
          go run ./cmd/api migrate

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ github.repository }}-py3.11-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Check formatting
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run ruff check --select E7,E9,F .

      - name: Run full test suite
        run: poetry run python -m pytest tests/ -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: recommendation_engine/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Build container
        run: docker build --tag novelsync-recs:pr .
