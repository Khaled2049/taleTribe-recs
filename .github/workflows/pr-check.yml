name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-recs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml

  infrastructure:
    name: taleTribe-recs / terraform-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout recommendations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: recommendation_engine/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          tags: novelsync-recs:pr
          cache-from: type=gha
  typecheck:
    name: taleTribe-recs / typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --with dev
      - run: poetry run pip install mypy==1.19.1
      - run: poetry run mypy --ignore-missing-imports recommendation_engine
  package:
    name: taleTribe-recs / package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --with dev
      - run: poetry check --lock
      - run: docker build --tag service:ci .
