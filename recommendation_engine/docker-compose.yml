# Local Postgres for the recommendation service.
#
#   docker compose -f recommendation_engine/docker-compose.yml up -d
#   python -m recommendation_engine.migrations.migrate
#
# Port 5434, not 5432 or 5433, so this never collides with a Postgres already
# running on the host — story-data's local stack (dev-new.sh) already claims
# 5433, and creditProxy's compose stack claims 5432.
#
# The pgvector image ships the extension prebuilt, so `CREATE EXTENSION vector`
# in the migration just works. The tag is unpinned to stay current; /health
# asserts the resulting version is >= 0.8.0, which is the floor that matters
# (hnsw.iterative_scan), so a too-old image fails visibly rather than silently
# degrading filtered recall.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recs-postgres
    environment:
      POSTGRES_USER: recs
      POSTGRES_PASSWORD: recs
      POSTGRES_DB: recs
    ports:
      - "5434:5432"
    volumes:
      - recs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recs -d recs"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      # Bulk-load friendly: the CMU backfill builds a 15k-row HNSW graph in one
      # go, which is memory-hungry and slow at the default 64MB.
      - "postgres"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_parallel_maintenance_workers=4"

volumes:
  recs-pgdata:
